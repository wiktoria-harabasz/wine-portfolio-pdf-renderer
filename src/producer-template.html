<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Wine Portfolio</title>
    <link rel="stylesheet" href="output.css">
</head>

<body>
    <div class="bg-champagne font-body font-weight-600 page ">
        <div class="flex flex-row justify-between w-full items-center mb-8 ">


            <button class="flex flex-row gap-2 items-center text-button">
                <img src="star_icon.svg" />
                Powrót do Spisu Treści
            </button>

            <div class="text-body">1</div>


        </div>



        <div class="flex flex-row align-top gap-4 mb-8">
            <div class="text-h1 uppercase"><!-- PRODUCER_NAME --></div> 
            <div class="text-subheading-number ">(01)</div>
        </div>

        <div class="flex flex-row items-center gap-4 mb-4">
            <h2 class="text-h2"><!-- PRODUCER_COUNTRY --></h2>
            <img src="/img/star_icon.svg" class="w-[24px] h-[24px]" />
            <h2 class="text-h2"><!-- PRODUCER_REGION --></h2>
        </div>

        <div class="flex flex-col gap-2 mb-8">
            <div class="flex flex-row items-center gap-2">
                <img src="/img/star_icon.svg" class="w-[17px] h-[17px]" />
                <h3 class="text-h3"><!-- PRODUCER_SUBREGION --></h3>
            </div>
            



        </div>
        <p class="text-body text-justify ">
           <!-- PRODUCER_INFO -->
        </p>

        <!-- Table -->
         <!-- WINE_TABLE -->
         

        <!-- Footer -->
        <div class="flex flex-row justify-between items-center w-full mt-64">
            <!-- Legend -->
            <div class="flex flex-row items-center gap-4 ">
                <div class="flex flex-row gap-2 items-center">
                    <img src="/assets/icons/white.svg" />
                    <div class="text-legend">White</div>
                </div>
                <div class="flex flex-row gap-2 items-center">
                    <img src="/assets/icons/macerated.svg" />
                    <div class="text-legend">Macerated</div>
                </div>
                <div class="flex flex-row gap-2 items-center">
                    <img src="/assets/icons/rose.svg" />
                    <div class="text-legend">Rose</div>
                </div>
                <div class="flex flex-row gap-2 items-center">
                    <img src="/assets/icons/red.svg" />
                    <div class="text-legend">Red</div>
                </div>
                <div class="flex flex-row gap-2 items-center">
                    <div class="text-legend"><span class="font-semibold">1.5L</span></div>
                    <div class="text-legend">Magnum</div>
                </div>
                <div class="flex flex-row gap-2 items-center">
                    <div class="text-legend"><span class="font-semibold">1/2</span></div>
                    <div class="text-legend">0.375 L</div>
                </div>
                <div class="flex flex-row gap-2 items-center">
                    <div class="text-legend"><span class="font-semibold">%</span></div>
                    <div class="text-legend">Fortified</div>
                </div>


            </div>
            <img src="/img/logo.svg" />
        </div>
